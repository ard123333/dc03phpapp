image:
  repository: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/php-app
  tag: "1"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: NodePort
  port: 80

mysql:
  image: mysql:8.0
  rootPassword: "RootPass123!"        # move to a real secret manager for production
  database: "appdb"
  user: "appuser"
  password: "AppPass123!"
  storage: "2Gi"

resources:
  php:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  mysql:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
